name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Validate plugin manifests
        run: node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/plugin.json')); JSON.parse(require('fs').readFileSync('.claude-plugin/marketplace.json'))"
      - name: Test sync, vault lint, and managed installer
        run: |
          node --test scripts/notion-sync/test/unit.test.js scripts/notion-sync/test/sync.test.js scripts/notion-sync/test/cli.test.js
          node --test scripts/vault-lint/test/lint.test.js scripts/test/managed-install.test.mjs
